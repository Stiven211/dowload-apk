<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskschool</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --glow: rgba(79,142,247,0.35);
      --text: #e8edf8;
      --muted: #7a8aad;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(79,142,247,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(167,139,250,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,142,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,142,247,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
      padding: 48px 32px;
      max-width: 520px;
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #1e2d50, #0f1830);
      border: 1.5px solid rgba(79,142,247,0.3);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px var(--glow), inset 0 1px 0 rgba(255,255,255,0.07);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 40px var(--glow); }
      50%      { box-shadow: 0 0 65px rgba(79,142,247,0.55); }
    }

    .icon-wrap svg {
      width: 44px; height: 44px;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.05;
      background: linear-gradient(135deg, #e8edf8 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 340px;
    }

    /* Badge row */
    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      background: rgba(79,142,247,0.08);
      border: 1px solid rgba(79,142,247,0.18);
      border-radius: 100px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }

    .badge svg { width:13px; height:13px; }

    /* Download button */
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 17px 38px;
      background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 6px 30px rgba(79,142,247,0.45);
    }

    .btn-download::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      border-radius: inherit;
    }

    .btn-download:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 40px rgba(79,142,247,0.65);
    }

    .btn-download:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-download svg { width: 22px; height: 22px; flex-shrink: 0; }

    /* Arrow bounce */
    .btn-download .arrow {
      animation: bounceDown 1.5s ease-in-out infinite;
    }

    @keyframes bounceDown {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(4px); }
    }

    .note {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .note span {
      color: rgba(167,139,250,0.8);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- App icon -->
  <div class="icon-wrap">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="10" width="28" height="32" rx="4" fill="#1e3a6e" stroke="#4f8ef7" stroke-width="1.5"/>
      <rect x="12" y="8" width="16" height="5" rx="2.5" fill="#4f8ef7" opacity=".9"/>
      <line x1="13" y1="22" x2="27" y2="22" stroke="#4f8ef7" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="28" x2="23" y2="28" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="34" x2="25" y2="34" stroke="#4f8ef7" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <circle cx="36" cy="34" r="8" fill="#0a0f1e" stroke="#4f8ef7" stroke-width="1.5"/>
      <path d="M33 34l2 2 4-4" stroke="#4f8ef7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Title -->
  <div>
    <h1 class="title">Taskschool</h1>
    <p class="subtitle" style="margin-top:10px;">Organiza tus tareas y materias escolares desde tu teléfono. Rápido, simple y siempre contigo.</p>
  </div>

  <!-- Badges -->
  <div class="badges">
    <div class="badge">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM7.25 5v4.19l2.97 1.77.63-1.06-2.35-1.4V5H7.25z"/></svg>
      Gratis
    </div>
    <div class="badge">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm3.5 8.5h-3v3h-1v-3h-3v-1h3v-3h1v3h3v1z"/></svg>
      Android
    </div>
    <div class="badge">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.85 3.75 4.15.6-3 2.93.71 4.14L8 10.35l-3.71 1.07.71-4.14-3-2.93 4.15-.6z"/></svg>
      v1.4
    </div>
  </div>

  <!-- Download button -->
  <a class="btn-download" href="TaskSchool.apk" download="TaskSchool.apk" id="dlBtn">
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v12M6 14l6 6 6-6"/>
      <line x1="4" y1="22" x2="20" y2="22"/>
    </svg>
    Descargar APK
  </a>

  <p class="note">Archivo .apk · Habilita <span>«Fuentes desconocidas»</span> para instalar</p>

  <p class="credits">Desarrollado por: <br> Kevin Stiven Urrego Rojas.</p>
  

</div>

</body>
</html>
